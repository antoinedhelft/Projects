[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unitaire: Tests unitaires rapides sans dépendances externes (base, API, modèles réels)
    integration: Tests d'intégration nécessitant la base de données ou des modèles
    monitoring: Tests de fraîcheur des données — exécutés manuellement, pas par le CI de merge
    nonregression: Tests ML post-entraînement — exécutés par monthly_train.yml après pipeline_train.py

# Ignorer les dossiers inutiles
norecursedirs = .git .venv .cryptenv __pycache__ .pytest_cache

# Verbosité
addopts = -v --tb=short
