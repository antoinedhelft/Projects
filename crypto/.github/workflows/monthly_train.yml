name: Monthly Model Training

on:
  schedule:
    - cron: '0 0 1 * *' # Le 1er de chaque mois à minuit
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Training Pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          PYTHONPATH: .
        run: python scripts/ml_pipeline/pipeline_train.py

      - name: Run non-regression tests
        env:
          PYTHONPATH: .
        run: pytest -m nonregression --tb=short -v
        # Si ce step échoue, le step suivant (upload HF) ne s'exécute pas.
        # Les modèles sous-performants ne sont donc jamais déployés.
