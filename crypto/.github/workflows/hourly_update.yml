name: Hourly Crypto Update

on:
  schedule:
    - cron: '0 * * * *' # Toutes les heures à la minute 0
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Incremental Update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python scripts/data_pipeline/incremental_update.py
