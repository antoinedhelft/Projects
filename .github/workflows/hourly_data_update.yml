name: Hourly Data Update

on:
  schedule:
    - cron: '0 * * * *' # Run at minute 0 of every hour
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r crypto/requirements.txt

    - name: Run Incremental Update
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Add the script directory to PYTHONPATH so imports work correctly if needed
        PYTHONPATH: ${{ github.workspace }}/crypto/scripts/data_pipeline
      run: |
        python crypto/scripts/data_pipeline/incremental_update.py
