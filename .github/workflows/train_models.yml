name: Train and Upload Models

on:
  schedule:
    # Run at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  train-and-upload:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r crypto/requirements.txt

    - name: Run Training Pipeline
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
        PYTHONPATH: ${{ github.workspace }}/crypto
      run: |
        python crypto/scripts/ml_pipeline/train_optimized.py
      - name: Run non-regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}/crypto
        run: pytest crypto/tests/ -m nonregression --tb=short -v
        # Si ce step échoue, le job échoue → les modèles ne sont pas déployés.